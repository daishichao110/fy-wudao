server:
  port: 8080
  address: 0.0.0.0
  shutdown: immediate
  servlet:
    context-path: /
    encoding:
      charset: UTF-8
      force: true
      enabled: true

spring:
  application:
    name: wudao-backend
  http:
    encoding:
      charset: UTF-8
      force: true
      enabled: true
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/wudao_db?useUnicode=true&characterEncoding=UTF-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: root
    password: 12345678

mybatis:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.wudao.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

logging:
  level:
    root: INFO
    com.wudao: DEBUG
    com.wudao.mapper: DEBUG

wx:
  appid: wx_test_appid
  secret: wx_test_secret

aliyun:
  oss:
    # 阿里云 OSS 访问节点（根据你的 Bucket 所在区域配置，如 oss-cn-hangzhou.aliyuncs.com）
    endpoint: oss-cn-hangzhou.aliyuncs.com
    # 阿里云子账号 AccessKey ID
    access-key-id: your_access_key_id
    # 阿里云子账号 AccessKey Secret
    access-key-secret: your_access_key_secret
    # OSS 存储桶名称
    bucket-name: your-bucket-name
    # 公网访问 URL 前缀，以 / 结尾（支持自定义 CDN 域名或标准地址）
    url-prefix: https://your-bucket-name.oss-cn-hangzhou.aliyuncs.com/

